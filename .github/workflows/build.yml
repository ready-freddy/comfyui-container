name: build-and-push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker tag to push (e.g., v5.5.5)"
        required: true
        default: "v5.5.5"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to Docker Hub & GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            readyfreddy/ready-freddy-template:${{ inputs.tag }}
            readyfreddy/ready-freddy-template:latest
            ghcr.io/ready-freddy/comfyui-cu128:${{ inputs.tag }}
            ghcr.io/ready-freddy/comfyui-cu128:latest
          cache-from: type=registry,ref=ghcr.io/ready-freddy/comfyui-cu128:buildcache
          cache-to: type=registry,ref=ghcr.io/ready-freddy/comfyui-cu128:buildcache,mode=min
